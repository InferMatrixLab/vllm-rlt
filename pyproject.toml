[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-rlt"
version = "0.2.0"
description = "Loop-level continuous batching for recurrent language models in vLLM"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.15"
dependencies = ["vllm"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
vllm-rlt = "vllm_rlt.entrypoints.cli:main"

[project.entry-points."vllm.general_plugins"]
rlt = "vllm_rlt.plugin:register"

[tool.setuptools.packages.find]
include = ["vllm_rlt*"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gpu: requires an explicitly selected CUDA device and --run-gpu"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
