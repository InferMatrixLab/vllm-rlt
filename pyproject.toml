[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-rlt"
version = "0.1.0"
description = "Loop-level continuous batching for Ouro language models"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.5",
    "safetensors>=0.4.3",
    "huggingface-hub>=0.25",
    "transformers>=4.54",
    "aiohttp>=3.11,<4",
    "triton>=3.1; platform_system == 'Linux'",
]

[project.optional-dependencies]
# Keep previous installation commands compatible; these dependencies are now included by default.
text = []
pd = ["nixl==1.4.1"]
serve = []
flash-attn = ["flash-attn>=2.8.3"]
flash-attn4 = ["flash-attn-4==4.0.0b30"]
flashinfer = ["flashinfer-python>=0.7.0"]
triton = []
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
vllm-rlt = "vllm_rlt.entrypoints.cli:main"
vllm-rlt-serve = "vllm_rlt.entrypoints.serve:main"
vllm-rlt-pd-serve = "vllm_rlt.entrypoints.pd_serve:main"

[tool.setuptools.packages.find]
include = ["vllm_rlt*"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gpu: requires a scheduler-reserved CUDA device"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
