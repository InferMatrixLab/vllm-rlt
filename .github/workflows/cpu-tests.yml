name: CPU tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cpu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: lint and CPU unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e .
          python -m pip install pytest ruff==0.13.2
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: CPU regression tests
        run: env OMP_NUM_THREADS=1 python -m pytest -q
