name: 🐛 Bug report
description: Raise an issue here if you find a bug.
title: "[Bug]: "
labels: ["bug"]

body:
- type: markdown
  attributes:
    value: >
      #### Before submitting an issue, please make sure the issue hasn't been already addressed by searching through [the existing and past issues](https://github.com/InferMatrixLab/vllm-rlt/issues?q=is%3Aissue+sort%3Acreated-desc+).
- type: markdown
  attributes:
    value: |
      ⚠️ **SECURITY WARNING:** Please review any text you paste to ensure it does not contain sensitive information such as:
      - API tokens or keys (e.g., Hugging Face tokens, OpenAI API keys)
      - Passwords or authentication credentials
      - Private URLs or endpoints
      - Personal or confidential data

      Consider redacting or replacing sensitive values with placeholders like `<YOUR_TOKEN_HERE>` when sharing configuration or code examples.
- type: textarea
  id: current-environment
  attributes:
    label: Your current environment
    description: |
      Please paste the output of the following commands.
      ```sh
      python -c "import sys, torch; print(sys.version); print(torch.__version__, torch.version.cuda)"
      pip list | grep -Ei "vllm[-_]rlt|torch|triton|flash|transformers|huggingface"
      nvidia-smi
      ```
    value: |
      <details>
      <summary>Environment info</summary>

      ```text
      Your output of the commands above
      ```

      </details>
  validations:
    required: true

- type: textarea
  id: code-version
  attributes:
    label: Your code version
    description: |
      Please provide a description of which commit id or version of vllm-rlt the code is.
      vllm-rlt runs standalone and does not require vLLM to be installed; if your setup
      combines it with other inference or training stacks, mention their versions too.
    value: |
      <details>
      <summary>The commit id or version of vllm-rlt</summary>

      ```text
      git rev-parse HEAD  # from your clone
      ```

      </details>
  validations:
    required: true

- type: textarea
  id: bug-description
  attributes:
    label: 🐛 Describe the bug
    description: |
      Please provide a clear and concise description of what the bug is.

      If relevant, add a minimal example so that we can reproduce the error by running the code. It is very important for the snippet to be as succinct (minimal) as possible, so please take time to trim down any irrelevant code to help us debug efficiently. We are going to copy-paste your code and we expect to get the same result as you did: avoid any external data, and include the relevant imports, etc. For example:

      ```python
      from vllm_rlt import CacheConfig, LLM, SamplingParams

      llm = LLM(
          '/path/to/Ouro-1.4B',
          device='cuda',
          attention_backend='triton',
          cache_config=CacheConfig(num_blocks=64),
      )
      outputs = llm.generate(
          ['The capital of France is'],
          SamplingParams(max_tokens=32, min_loops=2, max_loops=4, exit_threshold=0.7),
      )
      for output in outputs:
          print(output.text)
          print('Exit depths:', output.exit_depths)
      ```

      If the code is too long (hopefully, it isn't), feel free to put it in a public gist and link it in the issue: https://gist.github.com.

      Please also paste or describe the results you observe instead of the expected results. If you observe an error, please paste the error message including the **full** traceback of the exception. It may be relevant to wrap error messages in a fenced code block (triple backticks).
    placeholder: |
      A clear and concise description of what the bug is.

      ```python
      # Sample code to reproduce the problem
      ```

      ```
      The error message you got, with the full traceback and the error logs if present.
      ```
  validations:
    required: true
- type: markdown
  attributes:
    value: |
      ⚠️ Please separate bugs of the underlying model implementation (e.g., Hugging Face `transformers`) from bugs of `vllm-rlt`. If you think anything is wrong with the model's output:

      - Try the model with its reference implementation first. If the error appears there as well, please go to [their issues](https://github.com/huggingface/transformers/issues?q=is%3Aissue+is%3Aopen+sort%3Aupdated-desc+).

      - If the error only appears in vllm-rlt, please provide the detailed scripts showing how you ran both, and highlight the difference and what you expect.

      Thanks for reporting 🙏!
- type: checkboxes
  id: precheck
  attributes:
    label: Before submitting a new issue...
    options:
      - label: Make sure you already searched for relevant issues in the [issue tracker](https://github.com/InferMatrixLab/vllm-rlt/issues?q=is%3Aissue+sort%3Acreated-desc+), and looked for the answer in the [documentation](https://github.com/InferMatrixLab/vllm-rlt/tree/main/docs).
        required: true
