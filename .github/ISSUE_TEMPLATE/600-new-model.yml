name: 🤗 Support request for a new model
description: Submit a proposal/request for a new model support
title: "[New Model]: "
labels: ["new model"]

body:
- type: markdown
  attributes:
    value: >
      #### Before submitting an issue, please make sure the issue hasn't been already addressed by searching through [the existing and past issues](https://github.com/InferMatrixLab/vllm-rlt/issues?q=is%3Aissue+sort%3Acreated-desc+).

      #### vllm-rlt currently supports recurrent language models such as **ByteDance/Ouro-1.4B**. The [design notes](https://github.com/InferMatrixLab/vllm-rlt/blob/main/docs/design.md) describe the engine architecture and the model contract.
- type: textarea
  attributes:
    label: The model to consider.
    description: >
      A Hugging Face URL pointing to the model, e.g. https://huggingface.co/ByteDance/Ouro-1.4B.
  validations:
    required: true
- type: textarea
  attributes:
    label: The closest model vllm-rlt already supports.
    description: >
      vllm-rlt currently supports Ouro-1.4B. Which supported model is the most similar to the model you want to add support for?
- type: textarea
  attributes:
    label: What's your difficulty of supporting the model you want?
    description: >
      For example, any new operators or new architecture? A different recurrence scheme or loop structure? Does it use an early-exit gate? How does its KV state differ from the supported layouts?
- type: textarea
  attributes:
    label: Use case and motivation
    description: >
      What is the primary use case for this model? Why is it important to support in vllm-rlt?
- type: markdown
  attributes:
    value: >
      Thanks for contributing 🎉!
- type: checkboxes
  id: precheck
  attributes:
    label: Before submitting a new issue...
    options:
      - label: Make sure you already searched for relevant issues in the [issue tracker](https://github.com/InferMatrixLab/vllm-rlt/issues?q=is%3Aissue+sort%3Acreated-desc+), and looked for the answer in the [documentation](https://github.com/InferMatrixLab/vllm-rlt/tree/main/docs).
        required: true
