<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Baseline and loop-level speculative scheduling</title>
  <desc id="desc">The baseline completes draft positions and then batches target work. The loop pipeline advances parent and child positions in mixed-depth waves before verification.</desc>
  <style>
    .bg { fill: #fbfcfe; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .title { font: 700 24px sans-serif; fill: #0f172a; }
    .subtitle { font: 400 14px sans-serif; fill: #475569; }
    .lane { font: 700 18px sans-serif; fill: #0f172a; }
    .label { font: 600 13px sans-serif; fill: #334155; }
    .small { font: 400 12px sans-serif; fill: #475569; }
    .wave { font: 600 12px sans-serif; fill: #64748b; }
    .draft { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
    .deep { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .verify { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .prune { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .thin-arrow { fill: none; stroke: #94a3b8; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="40" y="42">Where loop-level pipelining changes the speculative round</text>
  <text class="subtitle" x="40" y="68">Example: K=2, draft depth d=2, target depth D=4. Each column is one host-launched recurrent wave.</text>

  <rect class="panel" x="32" y="94" width="1136" height="205" rx="12"/>
  <text class="lane" x="54" y="128">Baseline: block draft → block target verification</text>
  <text class="small" x="54" y="151">All draft positions finish first; the deep target work is then formed as one verification batch.</text>
  <rect class="draft" x="72" y="181" width="150" height="62" rx="8"/>
  <text class="label" x="147" y="207" text-anchor="middle">Draft A, B, C</text>
  <text class="small" x="147" y="227" text-anchor="middle">depths 0–1</text>
  <path class="arrow" d="M222 212 H304"/>
  <rect class="deep" x="306" y="181" width="245" height="62" rx="8"/>
  <text class="label" x="428" y="207" text-anchor="middle">Target core A, B, C</text>
  <text class="small" x="428" y="227" text-anchor="middle">depths 2–3, packed by position</text>
  <path class="arrow" d="M551 212 H633"/>
  <rect class="verify" x="635" y="181" width="190" height="62" rx="8"/>
  <text class="label" x="730" y="207" text-anchor="middle">Verify candidates</text>
  <text class="small" x="730" y="227" text-anchor="middle">accept / correct / bonus</text>
  <path class="arrow" d="M825 212 H907"/>
  <rect class="verify" x="909" y="181" width="190" height="62" rx="8"/>
  <text class="label" x="1004" y="207" text-anchor="middle">Commit and rollback</text>
  <text class="small" x="1004" y="227" text-anchor="middle">one atomic boundary</text>

  <rect class="panel" x="32" y="321" width="1136" height="350" rx="12"/>
  <text class="lane" x="54" y="355">Current loop pipeline: mixed-depth waves</text>
  <text class="small" x="54" y="378">The parent continues toward D while a child starts at depth 0 after d calls. Waves are sequential; no extra CUDA streams are used.</text>

  <text class="label" x="71" y="423">position</text>
  <text class="label" x="171" y="423">W0</text>
  <text class="label" x="281" y="423">W1</text>
  <text class="label" x="391" y="423">W2</text>
  <text class="label" x="501" y="423">W3</text>
  <text class="label" x="611" y="423">W4</text>
  <text class="label" x="721" y="423">W5</text>
  <text class="label" x="831" y="423">W6</text>
  <text class="label" x="941" y="423">W7</text>

  <text class="label" x="83" y="466">A</text>
  <text class="label" x="83" y="526">B</text>
  <text class="label" x="83" y="586">C</text>

  <rect class="draft" x="132" y="440" width="80" height="42" rx="7"/><text class="small" x="172" y="466" text-anchor="middle">d0</text>
  <rect class="draft" x="242" y="440" width="80" height="42" rx="7"/><text class="small" x="282" y="466" text-anchor="middle">d1</text>
  <rect class="deep" x="352" y="440" width="80" height="42" rx="7"/><text class="small" x="392" y="466" text-anchor="middle">d2</text>
  <rect class="deep" x="462" y="440" width="80" height="42" rx="7"/><text class="small" x="502" y="466" text-anchor="middle">d3 + target</text>

  <rect class="draft" x="352" y="500" width="80" height="42" rx="7"/><text class="small" x="392" y="526" text-anchor="middle">d0</text>
  <rect class="draft" x="462" y="500" width="80" height="42" rx="7"/><text class="small" x="502" y="526" text-anchor="middle">d1</text>
  <rect class="deep" x="572" y="500" width="80" height="42" rx="7"/><text class="small" x="612" y="526" text-anchor="middle">d2</text>
  <rect class="deep" x="682" y="500" width="80" height="42" rx="7"/><text class="small" x="722" y="526" text-anchor="middle">d3 + target</text>

  <rect class="draft" x="572" y="560" width="80" height="42" rx="7"/><text class="small" x="612" y="586" text-anchor="middle">d0</text>
  <rect class="draft" x="682" y="560" width="80" height="42" rx="7"/><text class="small" x="722" y="586" text-anchor="middle">d1</text>
  <rect class="deep" x="792" y="560" width="80" height="42" rx="7"/><text class="small" x="832" y="586" text-anchor="middle">d2</text>
  <rect class="deep" x="902" y="560" width="80" height="42" rx="7"/><text class="small" x="942" y="586" text-anchor="middle">d3 + target</text>

  <path class="thin-arrow" d="M212 461 H242"/>
  <path class="thin-arrow" d="M322 461 H352"/>
  <path class="thin-arrow" d="M432 521 H462"/>
  <path class="thin-arrow" d="M652 581 H682"/>
  <path class="thin-arrow" d="M432 461 C470 470 455 510 462 520"/>
  <path class="thin-arrow" d="M652 521 C690 530 675 570 682 580"/>

  <rect class="verify" x="1010" y="440" width="125" height="42" rx="7"/>
  <text class="small" x="1072" y="466" text-anchor="middle">reorder + verify</text>
  <path class="arrow" d="M982 581 C1010 581 990 461 1010 461"/>
  <text class="small" x="1010" y="525">target rows arrive</text>

  <rect class="draft" x="72" y="638" width="18" height="18" rx="3"/>
  <text class="small" x="98" y="652">shallow / draft depth</text>
  <rect class="deep" x="252" y="638" width="18" height="18" rx="3"/>
  <text class="small" x="278" y="652">deep / target depth</text>
  <rect class="verify" x="430" y="638" width="18" height="18" rx="3"/>
  <text class="small" x="456" y="652">common verifier and commit</text>
  <text class="small" x="760" y="652">Early prune: only unscheduled suffix branches can be removed.</text>
</svg>
