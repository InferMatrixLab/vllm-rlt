<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1840" viewBox="0 0 2400 1840" role="img" aria-labelledby="title desc"><title id="title">Stage structure: processes, ownership and calls</title><desc id="desc">StageClient lives in the caller process and controls a spawned worker through a Pipe. StageWorker drives its engine and optional connector. StageEngine calls Scheduler and Executor; Scheduler does not invoke the runner. Ordinary and speculative runners share ModelRuntime, model, KV and RNG. Tickets return to engine-owned completion handling.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="2400" height="1840" fill="white"/>
<text x="60" y="66" font-family="Arial,Helvetica,sans-serif" font-size="45" fill="#213951" font-weight="700" text-anchor="start">Inside a stage: who owns, who drives, who executes</text>
<text x="60" y="112" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#71839a" font-weight="400" text-anchor="start">Process boundaries outside. Component responsibilities inside. Local loops never require a client round trip.</text>
