<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1220" viewBox="0 0 1900 1220" role="img" aria-labelledby="title desc"><title id="title">Compute here. Continue there.</title><desc id="desc">A prefill stage computes KV chunks and hidden state. A connector delivers them into reserved storage in a decode stage. After all data and commit, scheduler admission allows CODA and decode. Source storage is retained until local readers finish and remote access is safe.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="1900" height="1220" fill="white"/>
<text x="50" y="67" font-family="Arial,Helvetica,sans-serif" font-size="44" fill="#213951" font-weight="700" text-anchor="start">03 / Compute here. Continue there.</text>
<text x="50" y="112" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#71839a" font-weight="400" text-anchor="start">Same request identity. Local state in each stage. The same scheduler / execution cycle.</text>
