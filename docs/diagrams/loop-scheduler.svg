<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
<title id="title">The scheduler batches each request’s next loop</title><desc id="desc">Three requests at different recurrent depths share one batch. The scheduler applies per-request progress and regroups remaining loops. A request exiting recurrence is scheduled separately for coda.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#3569b8" stroke-width="1.7"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#234f88" flood-opacity=".06"/></filter></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b45}.title{font-size:40px;font-weight:700;letter-spacing:-.6px}.h{font-size:28px;font-weight:700}.body{font-size:22px}.small{font-size:19px}.tiny{font-size:17px}.muted{fill:#65788f}.blue{fill:#285fa7}.bold{font-weight:700}.white{fill:white}</style>
<rect width="1800" height="1320" fill="#fff"/>
<text x="60" y="75" class="title" text-anchor="start">The scheduler batches each request’s next loop.</text>
<text x="60" y="119" class="body muted" text-anchor="start">Mixed detail · Follow selection, execution and feedback. Independent request progress.</text>
<text x="60" y="191" class="small blue bold" text-anchor="start">SCHEDULER · DECIDE WHAT RUNS</text>
<text x="920" y="191" class="small blue bold" text-anchor="start"></text>
<text x="1400" y="191" class="small muted bold" text-anchor="start">EXECUTION · RUN SELECTED WORK</text>
<rect x="60" y="220" width="1230" height="490" rx="18" fill="#f1f6fd" stroke="#89a9d6" stroke-width="1.6" filter="url(#shadow)"/>
<path d="M78 220H1272Q1290 220 1290 238V307H60V238Q60 220 78 220" fill="#234f88"/>
<text x="90" y="260" class="h white" text-anchor="start">Scheduler</text>
<text x="90" y="290" class="small white" text-anchor="start">Select operation · token range · recurrent depth</text>
<text x="1255" y="260" class="body white" text-anchor="end">6 token rows  /  3 requests</text>
<text x="1255" y="290" class="small white" text-anchor="end">Mixed policy · split prefill</text>
<text x="90" y="345" class="small blue bold" text-anchor="start">01  CHOOSE READY PHASES</text>

<text x="1085" y="345" class="small blue bold" text-anchor="middle">02  BUILD THE BATCH</text>
<rect x="90" y="372" width="38" height="38" rx="10" fill="#fff2da" stroke="#c9932c" stroke-width="1.6" />
<text x="109" y="399" class="body bold" text-anchor="middle">A</text>
<text x="145" y="396" class="body bold" text-anchor="start">Prefill chunk</text>
<text x="145" y="424" class="small muted" text-anchor="start">4 prompt tokens</text>
<rect x="350" y="371" width="96" height="48" rx="10" fill="#e4ebf4" stroke="#c6d3e3" stroke-width="1.6" />
<text x="398" y="402" class="small muted" text-anchor="middle">L1 ✓</text>
<rect x="468" y="371" width="96" height="48" rx="10" fill="#fff2da" stroke="#c9932c" stroke-width="1.6" />
<text x="516" y="402" class="small bold" text-anchor="middle">Loop 2</text>
<text x="516" y="443" class="tiny blue bold" text-anchor="middle">NEXT</text>
<rect x="586" y="371" width="96" height="48" rx="10" fill="#fafcff" stroke="#dce5ef" stroke-width="1.6" />
<text x="634" y="402" class="small muted" text-anchor="middle">Loop 3</text>
<rect x="704" y="371" width="96" height="48" rx="10" fill="#fafcff" stroke="#dce5ef" stroke-width="1.6" />
<text x="752" y="402" class="small muted" text-anchor="middle">Loop 4</text>
<rect x="90" y="472" width="38" height="38" rx="10" fill="#eee7fd" stroke="#9871ce" stroke-width="1.6" />
<text x="109" y="499" class="body bold" text-anchor="middle">B</text>
<text x="145" y="496" class="body bold" text-anchor="start">Decode token</text>
<text x="145" y="524" class="small muted" text-anchor="start">1 token</text>
<rect x="350" y="471" width="96" height="48" rx="10" fill="#e4ebf4" stroke="#c6d3e3" stroke-width="1.6" />
<text x="398" y="502" class="small muted" text-anchor="middle">L1 ✓</text>
<rect x="468" y="471" width="96" height="48" rx="10" fill="#e4ebf4" stroke="#c6d3e3" stroke-width="1.6" />
<text x="516" y="502" class="small muted" text-anchor="middle">L2 ✓</text>
<rect x="586" y="471" width="96" height="48" rx="10" fill="#eee7fd" stroke="#9871ce" stroke-width="1.6" />
<text x="634" y="502" class="small bold" text-anchor="middle">Loop 3</text>
<text x="634" y="543" class="tiny blue bold" text-anchor="middle">NEXT</text>
<rect x="704" y="471" width="96" height="48" rx="10" fill="#fafcff" stroke="#dce5ef" stroke-width="1.6" />
<text x="752" y="502" class="small muted" text-anchor="middle">Loop 4</text>
<rect x="90" y="572" width="38" height="38" rx="10" fill="#ddf4f3" stroke="#429d9a" stroke-width="1.6" />
<text x="109" y="599" class="body bold" text-anchor="middle">C</text>
<text x="145" y="596" class="body bold" text-anchor="start">Decode token</text>
<text x="145" y="624" class="small muted" text-anchor="start">1 token</text>
<rect x="350" y="571" width="96" height="48" rx="10" fill="#ddf4f3" stroke="#429d9a" stroke-width="1.6" />
<text x="398" y="602" class="small bold" text-anchor="middle">Loop 1</text>
<text x="398" y="643" class="tiny blue bold" text-anchor="middle">NEXT</text>
<rect x="468" y="571" width="96" height="48" rx="10" fill="#fafcff" stroke="#dce5ef" stroke-width="1.6" />
<text x="516" y="602" class="small muted" text-anchor="middle">Loop 2</text>
<rect x="586" y="571" width="96" height="48" rx="10" fill="#fafcff" stroke="#dce5ef" stroke-width="1.6" />
<text x="634" y="602" class="small muted" text-anchor="middle">Loop 3</text>
<rect x="704" y="571" width="96" height="48" rx="10" fill="#fafcff" stroke="#dce5ef" stroke-width="1.6" />
<text x="752" y="602" class="small muted" text-anchor="middle">Loop 4</text>
<rect x="920" y="366" width="330" height="275" rx="14" fill="#fff" stroke="#88a9d6" stroke-width="1.6" />
<text x="945" y="399" class="body blue bold" text-anchor="start">RECURRENT</text>
<rect x="940" y="420" width="290" height="49" rx="10" fill="#eee7fd" stroke="#9871ce" stroke-width="1.6" />
<text x="960" y="452" class="body bold" text-anchor="start">B</text>
<text x="1210" y="452" class="small bold" text-anchor="end">Loop 3 · 1 row</text>
<rect x="940" y="484" width="290" height="49" rx="10" fill="#ddf4f3" stroke="#429d9a" stroke-width="1.6" />
<text x="960" y="516" class="body bold" text-anchor="start">C</text>
<text x="1210" y="516" class="small bold" text-anchor="end">Loop 1 · 1 row</text>
<rect x="940" y="548" width="290" height="49" rx="10" fill="#fff2da" stroke="#c9932c" stroke-width="1.6" />
<text x="960" y="580" class="body bold" text-anchor="start">A</text>
<text x="1210" y="580" class="small bold" text-anchor="end">Loop 2 · 4 rows</text>
<text x="1085" y="624" class="tiny muted" text-anchor="middle">Different depths, shared operation</text>
<path d="M820 505H920" fill="none" stroke="#3569b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="870" y="475" class="small blue" text-anchor="middle">pack</text>
<path d="M860 328V445 M860 545V650" stroke="#b8cce6" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="90" y="681" class="small blue" text-anchor="start">Policy selects ready prompt + decode recurrent queues.</text>
<text x="1085" y="681" class="tiny blue" text-anchor="middle">Ranges · depths · KV / token budget</text>
<text x="90" y="740" class="tiny muted" text-anchor="start">policy.schedule() → compatible phases</text>
<text x="920" y="740" class="tiny muted" text-anchor="start">take_phases() → SchedulerOutput</text>
<rect x="1400" y="392" width="340" height="235" rx="18" fill="#fff" stroke="#ccd9e8" stroke-width="1.6" />
<text x="1425" y="434" class="h" text-anchor="start">03  Execute batch</text>
<text x="1425" y="467" class="small muted" text-anchor="start">Executor → runner → runtime</text>
<rect x="1425" y="490" width="290" height="64" rx="12" fill="#e4efff" stroke="#89a9d6" stroke-width="1.6" />
<text x="1570" y="529" class="body blue bold" text-anchor="middle">RECURRENT forward</text>
<text x="1570" y="593" class="tiny muted" text-anchor="middle">Prepare inputs → forward → result</text>
<path d="M1250 505H1425" fill="none" stroke="#3569b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1340" y="480" class="small blue bold" text-anchor="middle">submit</text>
<rect x="380" y="805" width="1360" height="190" rx="18" fill="#f8fafc" stroke="#d0dce9" stroke-width="1.6" />
<text x="410" y="848" class="h" text-anchor="start">04  Apply progress &amp; requeue</text>
<text x="1705" y="848" class="small muted bold" text-anchor="end">StageEngine → Scheduler queues</text>
<text x="410" y="879" class="small muted" text-anchor="start">StageEngine updates each request and calls Scheduler.enqueue() for its next phase.</text>
<rect x="410" y="909" width="350" height="56" rx="12" fill="#fff2da" stroke="#c9932c" stroke-width="1.6" />
<text x="430" y="945" class="body bold" text-anchor="start">A   Next: loop 3</text>
<rect x="790" y="909" width="490" height="56" rx="12" fill="#eee7fd" stroke="#9871ce" stroke-width="1.6" />
<text x="810" y="945" class="body bold" text-anchor="start">B   Exit recurrence → CODA</text>
<rect x="1310" y="909" width="400" height="56" rx="12" fill="#ddf4f3" stroke="#429d9a" stroke-width="1.6" />
<text x="1330" y="945" class="body bold" text-anchor="start">C   Next: loop 2</text>
<path d="M1570 627V805" fill="none" stroke="#3569b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1590" y="752" class="small blue" text-anchor="start">results / events</text>
<path d="M380 858H30V410H60" fill="none" stroke="#3569b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="75" y="775" class="body blue bold" text-anchor="start">Return to step 01</text>
<text x="60" y="1063" class="small blue bold" text-anchor="start">NEXT ITERATION · REPEAT 01–03 WITH UPDATED REQUESTS</text>
<rect x="60" y="1090" width="1040" height="132" rx="16" fill="#f1f6fd" stroke="#a4bedf" stroke-width="1.6" />
<text x="90" y="1130" class="body blue bold" text-anchor="start">After re-selection</text>
<rect x="90" y="1150" width="320" height="48" rx="10" fill="#ddf4f3" stroke="#429d9a" stroke-width="1.6" />
<text x="110" y="1182" class="small bold" text-anchor="start">C   Loop 2 · 1 row</text>
<rect x="440" y="1150" width="340" height="48" rx="10" fill="#fff2da" stroke="#c9932c" stroke-width="1.6" />
<text x="460" y="1182" class="small bold" text-anchor="start">A   Loop 3 · 4 rows</text>
<text x="815" y="1170" class="body blue bold" text-anchor="start">5 token rows</text>
<text x="815" y="1198" class="tiny muted" text-anchor="start">Room for ready work</text>
<rect x="1150" y="1090" width="590" height="132" rx="16" fill="#eee7fd" stroke="#9871ce" stroke-width="1.6" />
<text x="1180" y="1130" class="body bold" text-anchor="start">B leaves the recurrent batch</text>
<text x="1180" y="1167" class="body" text-anchor="start">CODA is scheduled separately.</text>
<text x="1180" y="1198" class="tiny muted" text-anchor="start">Exit from recurrence does not mean request completion.</text>
<text x="60" y="1263" class="small muted" text-anchor="start">Logical decision cycle, not a host barrier per loop. Events protect device readiness; other operations may intervene.</text>
<text x="60" y="1295" class="tiny muted" text-anchor="start">Loops are numbered 1–4 here (code depth: 0–3). Compatible mixed recurrence only; speculative rounds are excluded.</text>
</svg>
