<text x="390" y="207" class="title blue" text-anchor="start">Stage</text>
<text x="390" y="241" class="body muted" text-anchor="start">Independent deployment · local resource ownership</text>
<text x="1410" y="204" class="tiny muted" text-anchor="end">PREFILL / DECODE / PREFILL_DECODE</text>
<text x="145" y="269" class="tiny muted bold" text-anchor="middle">NO UPSTREAM</text>
