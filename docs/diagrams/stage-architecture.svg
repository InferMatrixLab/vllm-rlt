<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1240" viewBox="-20 -20 1840 1240" role="img" aria-labelledby="title description">
<title id="title">Composable stages with loop-level scheduling and execution</title>
<desc id="description">An independently owned stage receives requests directly or state through an optional upstream connector, and delivers output directly or hands state to an optional downstream stage. Inside, scheduler, execution, and request and KV progress form a loop. Recurrent work is scheduled by depth and may combine compatible prefill and decode work.</desc>
<defs>
<marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#3569b8" stroke-width="1.7" stroke-linejoin="round"/></marker>
<marker id="grayArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#8996a8" stroke-width="1.5"/></marker>
<filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#183b66" flood-opacity="0.07"/></filter>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b45}.title{font-size:38px;font-weight:700;letter-spacing:-.5px}.h{font-size:28px;font-weight:700}.body{font-size:22px}.small{font-size:20px}.tiny{font-size:17px}.muted{fill:#61748a}.blue{fill:#265ca9}.bold{font-weight:700}</style>
<rect x="-20" y="-20" width="1840" height="1240" fill="white"/>

<text x="40" y="63" class="title" text-anchor="start">Composable stages. Loop-level scheduling and execution.</text>
<text x="40" y="105" class="body muted" text-anchor="start">The scheduler drives request progress and mixed batching; execution runs the selected work.</text>
