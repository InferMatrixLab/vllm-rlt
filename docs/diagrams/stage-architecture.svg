<text x="445" y="831" class="body blue bold" text-anchor="start">Per-request progress &amp; KV state</text>
<text x="445" y="865" class="small" text-anchor="start">Each request advances or exits independently</text>
<text x="445" y="892" class="small muted" text-anchor="start">Independent depth · token range · KV validity</text>
<path d="M1245,780 V850 H1015" fill="none" stroke="#3569b8" stroke-width="2.5" marker-end="url(#blueArrow)"/>
<text x="1130" y="880" class="tiny blue" text-anchor="middle">Completion feedback</text>
<path d="M450,800 V751" fill="none" stroke="#3569b8" stroke-width="2.5" marker-end="url(#blueArrow)"/>
<text x="475" y="775" class="small blue" text-anchor="start">Regroup for the next loop</text>

<path d="M1015,900 H1395 V370 H1295 V355" fill="none" stroke="#8996a8" stroke-width="2.5" marker-end="url(#grayArrow)"/>
<text x="1278" y="377" class="tiny muted" text-anchor="end">Output or handoff ready</text>
<text x="900" y="966" class="small muted" text-anchor="middle">Independent request progress. Consecutive loops can run in one submission.</text>
<rect x="390" y="1005" width="1020" height="66" rx="10" fill="#f1f4f8" stroke="#dce3eb" stroke-width="1.5"/>
<text x="900" y="1045" class="body muted" text-anchor="middle">Owned resources: model · KV cache · request state · reusable buffers</text>
<text x="40" y="1151" class="small muted" text-anchor="start">Blue: scheduler-driven execution and feedback. Gray inside Execution: model operation order. Dashed gray: stage transfer.</text>
<text x="40" y="1182" class="tiny muted" text-anchor="start">Mixed = compatible recurrent work across requests, prompt/decode work and loop depths within one stage. Speculative rounds are not included.</text>
</svg>
