<rect x="400" y="400" width="640" height="530" rx="18" fill="#f0f5fd" stroke="#7399ce" stroke-width="2.5" filter="url(#cardShadow)"/>
<path d="M418,400 H1022 Q1040,400 1040,418 V482 H400 V418 Q400,400 418,400" fill="#234f88"/>
<text x="1015" y="437" class="tiny" text-anchor="end" style="fill:#d6e5fa;letter-spacing:1px">LOOP CONTROL</text>
