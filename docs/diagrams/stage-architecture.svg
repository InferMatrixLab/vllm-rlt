<rect x="1610" y="515" width="290" height="220" rx="18" fill="#f3f6fa" stroke="#abbacf" stroke-width="2"/>
<text x="1630" y="565" class="small bold" text-anchor="start">Downstream stage</text>
<text x="1630" y="600" class="tiny muted" text-anchor="start">Same stage design</text>
<path d="M1685,650 H1825 V695 H1685 V655" fill="none" stroke="#8996a8" stroke-width="2" marker-end="url(#grayArrow)"/>
<text x="45" y="780" class="title muted" text-anchor="start">…</text>
<text x="1745" y="780" class="title muted" text-anchor="start">…</text>
</g>
